name: Android APK

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional: sign with your own key so new versions install over old ones.
      # Without these secrets the APK is signed with a throwaway debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; using a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zen.jks"
          {
            echo "ZEN_KEYSTORE_PATH=$RUNNER_TEMP/zen.jks"
            echo "ZEN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ZEN_KEY_ALIAS=$KEY_ALIAS"
            echo "ZEN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/zen-1.0.${{ github.run_number }}.apk"

      # Tests for the focus schedule rules that decide when apps are blocked.
      - name: Android unit tests
        working-directory: flutter_app/android
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zen-apk
          path: ${{ runner.temp }}/zen-1.0.${{ github.run_number }}.apk

      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Zen 1.0.${{ github.run_number }}
          make_latest: true
          files: ${{ runner.temp }}/zen-1.0.${{ github.run_number }}.apk
          body: |
            Download the `.apk` below on your Android phone, open it, and allow installing from this source when asked.
            The app works fully offline.
