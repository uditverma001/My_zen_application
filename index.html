<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zen</title>
  <meta name="description" content="A calm, offline space for breathing, meditation and reflection.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <!-- Today -->
    <section class="view active" id="view-today" aria-labelledby="today-title">
      <header class="view-header">
        <p class="eyebrow" id="today-date"></p>
        <h1 id="today-title">Good to see you</h1>
      </header>

      <figure class="quote-card">
        <blockquote id="quote-text"></blockquote>
        <figcaption id="quote-author"></figcaption>
      </figure>

      <div class="stats">
        <div class="stat"><span class="stat-value" id="stat-streak">0</span><span class="stat-label">day streak</span></div>
        <div class="stat"><span class="stat-value" id="stat-minutes">0</span><span class="stat-label">minutes total</span></div>
        <div class="stat"><span class="stat-value" id="stat-sessions">0</span><span class="stat-label">sessions</span></div>
      </div>

      <div class="week" id="week" aria-label="Practice this week"></div>

      <div class="quick">
        <button class="btn" data-goto="breathe">Take a breath</button>
        <button class="btn btn-ghost" data-goto="meditate">Sit for a while</button>
      </div>
    </section>

    <!-- Breathe -->
    <section class="view" id="view-breathe" aria-labelledby="breathe-title">
      <header class="view-header">
        <p class="eyebrow">Breathe</p>
        <h1 id="breathe-title">Follow the circle</h1>
      </header>

      <div class="chips" id="breath-patterns" role="radiogroup" aria-label="Breathing pattern"></div>
      <p class="hint" id="breath-desc"></p>

      <div class="breath-stage">
        <div class="breath-ring"></div>
        <div class="breath-circle" id="breath-circle"></div>
        <div class="breath-label">
          <span id="breath-phase" aria-live="polite">Ready</span>
          <span id="breath-count"></span>
        </div>
      </div>

      <p class="hint center" id="breath-cycles"></p>
      <div class="quick center">
        <button class="btn" id="breath-toggle">Begin</button>
      </div>
    </section>

    <!-- Meditate -->
    <section class="view" id="view-meditate" aria-labelledby="meditate-title">
      <header class="view-header">
        <p class="eyebrow">Meditate</p>
        <h1 id="meditate-title">Sit quietly</h1>
      </header>

      <div class="chips" id="durations" role="radiogroup" aria-label="Duration"></div>

      <div class="timer">
        <svg viewBox="0 0 200 200" class="timer-ring" aria-hidden="true">
          <circle cx="100" cy="100" r="90" class="track"/>
          <circle cx="100" cy="100" r="90" class="progress" id="timer-progress"/>
        </svg>
        <div class="timer-text" id="timer-text" role="timer" aria-live="off">05:00</div>
      </div>

      <div class="options">
        <label class="toggle">
          <input type="checkbox" id="opt-ambient">
          <span>Soft background sound</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-interval">
          <span>Gentle bell every minute</span>
        </label>
      </div>

      <div class="quick center">
        <button class="btn" id="timer-toggle">Begin</button>
        <button class="btn btn-ghost" id="timer-reset" hidden>End</button>
      </div>
    </section>

    <!-- Journal -->
    <section class="view" id="view-journal" aria-labelledby="journal-title">
      <header class="view-header">
        <p class="eyebrow">Journal</p>
        <h1 id="journal-title">How are you, really?</h1>
      </header>

      <form id="journal-form" class="journal-form">
        <div class="moods" id="moods" role="radiogroup" aria-label="Mood"></div>
        <label class="sr-only" for="journal-text">Your note</label>
        <textarea id="journal-text" rows="4" placeholder="A few words about this moment…"></textarea>
        <button class="btn" type="submit">Save</button>
      </form>

      <ul class="entries" id="entries"></ul>
      <p class="hint center" id="entries-empty">Your entries stay on this device only.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab active" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-view="breathe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>
      <span>Breathe</span>
    </button>
    <button class="tab" data-view="meditate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Meditate</span>
    </button>
    <button class="tab" data-view="journal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>
      <span>Journal</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
